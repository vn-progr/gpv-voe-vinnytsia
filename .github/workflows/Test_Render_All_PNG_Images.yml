name: 🧪 Test Render (Artifacts Only)

on:
  workflow_dispatch: # Ручний запуск з вкладки Actions

jobs:
  test_render:
    name: Generate & Upload Test PNGs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy requests beautifulsoup4

      - name: 🎨 Render PNGs to Test Directory
        run: |
          set -e
          JSON_FILE="data/Vinnytsiaoblenerho.json"
          TEST_DIR="images/test"
          
          echo "🧹 Cleaning test directory..."
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"
          
          echo "🎨 1/3 Rendering 12 per-queue test charts..."
          python scripts/render_png.py --json "$JSON_FILE" --out "$TEST_DIR" --force
          
          echo "🎨 2/3 Rendering TODAY test overview..."
          python scripts/render_png_all_today.py --json "$JSON_FILE" --out "$TEST_DIR" --force
          
          echo "🎨 3/3 Rendering TOMORROW test overview..."
          python scripts/render_png_all_tomorrow.py --json "$JSON_FILE" --out "$TEST_DIR" --force
          
          echo "✅ All 14 test PNGs successfully created in $TEST_DIR!"

      - name: 📦 Upload Images as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-test-schedules
          path: images/test/*.png
          retention-days: 1

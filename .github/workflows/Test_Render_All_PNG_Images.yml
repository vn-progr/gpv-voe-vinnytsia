name: 🧪 Test Render All PNG Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render_test_images:
    name: Generate Test PNGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy requests beautifulsoup4

      - name: Render Test PNGs to Test Directory
        run: |
          set -e
          JSON_FILE="data/Vinnytsiaoblenerho.json"
          TEST_DIR="images/test"
          
          echo "🧹 Cleaning previous test images..."
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"
          
          echo "🎨 1/3 Rendering 12 per-queue test charts..."
          python scripts/render_png.py --json "$JSON_FILE" --out "$TEST_DIR" --force
          
          echo "🎨 2/3 Rendering TODAY test overview..."
          python scripts/render_png_all_today.py --json "$JSON_FILE" --out "$TEST_DIR" --force
          
          echo "🎨 3/3 Rendering TOMORROW test overview..."
          python scripts/render_png_all_tomorrow.py --json "$TEST_DIR" --out "$TEST_DIR" --force
          
          echo "✅ Test PNGs successfully generated in $TEST_DIR!"

      - name: Commit and Push Test Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Зараховуємо ТІЛЬКИ тестову папку images/test
          git add images/test/
          
          if git diff-index --quiet HEAD; then
            echo "No image changes detected to commit."
          else
            git commit -m "🧪 Test render: updated PNGs in images/test"
            
            # Скидаємо будь-які випадкові зміни в інших папках
            git checkout -- .
            git clean -fd
            
            git pull --rebase origin main
            git push origin main
            echo "Successfully pushed test PNGs to images/test!"
          fi

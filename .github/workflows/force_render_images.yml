- name: 🎨 Render PNG Schedules (Ignoring Hash)
        run: |
          JSON_FILE="data/Vinnytsiaoblenerho.json"
          OUT_DIR="images/Vinnytsiaoblenerho"
          
          echo "🎨 Starting forced image generation..."
          mkdir -p "$OUT_DIR"
          
          # 1. Генерація 12 окремих картинок для кожної черги
          echo "📊 Rendering 12 per-queue charts..."
          python scripts/render_png.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          
          # 2. Генерація gpv-all-today.png (виправлено назву файла)
          echo "📊 Rendering TODAY overview..."
          python scripts/render_png_all_today.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          
          # 3. Генерація gpv-all-tomorrow.png (виправлено назву файла)
          echo "📊 Rendering TOMORROW overview..."
          python scripts/render_png_all_tomorrow.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          
          echo "✅ All 14 images generated in $OUT_DIR"

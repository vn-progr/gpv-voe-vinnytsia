name: Force Render All PNG Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/Vinnytsiaoblenerho.json'

permissions:
  contents: write

jobs:
  render_images:
    name: Generate All PNG Schedules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy requests beautifulsoup4

      - name: Render PNG Schedules
        run: |
          set -e
          JSON_FILE="data/Vinnytsiaoblenerho.json"
          OUT_DIR="images/Vinnytsiaoblenerho"
          
          echo "🎨 1/3 Rendering 12 per-queue charts..."
          python scripts/render_png.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          
          echo "🎨 2/3 Rendering TODAY overview..."
          python scripts/render_png_all_today.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          
          echo "🎨 3/3 Rendering TOMORROW overview..."
          python scripts/render_png_all_tomorrow.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          
          echo "✅ All 14 images generated successfully!"

      - name: Commit and Push Generated Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add images/
          
          if git diff-index --quiet HEAD; then
            echo "No image changes detected to commit."
          else
            git commit -m "Force render: updated all 14 PNG schedule images"
            git pull --rebase origin main
            git push origin main
            echo "Successfully pushed all updated images to main!"
          fi

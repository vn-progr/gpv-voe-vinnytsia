name: 🎨 Force Render All PNG Images

on:
  workflow_dispatch: # Ручний запуск з інтерфейсу GitHub
  push:
    branches:
      - main
    paths:
      - 'data/Vinnytsiaoblenerho.json' # Запускається при оновленні JSON-файлу

jobs:
  render_images:
    name: Generate PNGs (Force Render)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy requests beautifulsoup4

      - name: 🎨 Render PNG Schedules (Ignoring Hash)
        run: |
          JSON_FILE="data/Vinnytsiaoblenerho.json"
          OUT_DIR="images/Vinnytsiaoblenerho"
          
          echo "🎨 Starting forced image generation..."
          mkdir -p "$OUT_DIR"
          
          # 1. Окремі графіки для кожної черги
          if [ -f "scripts/render_png.py" ]; then
            echo "📊 Rendering per-queue charts..."
            python scripts/render_png.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          fi
          
          # 2. Зведений графік на сьогодні
          if [ -f "scripts/render_all_today.py" ]; then
            echo "📊 Rendering TODAY overview..."
            python scripts/render_all_today.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          elif [ -f "scripts/render_png_all_today.py" ]; then
            echo "📊 Rendering TODAY overview..."
            python scripts/render_png_all_today.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          fi
          
          # 3. Зведений графік на завтра
          if [ -f "scripts/render_all_tomorrow.py" ]; then
            echo "📊 Rendering TOMORROW overview..."
            python scripts/render_all_tomorrow.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          elif [ -f "scripts/render_png_all_tomorrow.py" ]; then
            echo "📊 Rendering TOMORROW overview..."
            python scripts/render_png_all_tomorrow.py --json "$JSON_FILE" --out "$OUT_DIR" --force
          fi

      - name: 🚀 Commit & Push Generated Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add images/
          
          # Перевірка наявності змін перед комітом
          if git diff-index --quiet HEAD; then
            echo "ℹ️ No image changes detected to commit."
          else
            git commit -m "🎨 Force render: updated all PNG schedule images"
            git push
            echo "✅ Successfully pushed updated images to main!"
          fi

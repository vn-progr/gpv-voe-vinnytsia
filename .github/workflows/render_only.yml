name: 🎨 Render PNG Schedules Only

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy

      - name: 🔌 Update Vinnytsia Images
        run: |
          python scripts/render_png.py --json data/Vinnytsiaoblenerho.json --out images/Vinnytsiaoblenerho

      - name: Commit and push PNGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git diff-index --quiet HEAD || (git commit -m "🎨 Update Vinnytsia Images" && git push)

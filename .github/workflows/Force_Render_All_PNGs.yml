- name: 🎨 Render PNG Schedules
      run: |
        JSON_FILE="data/Vinnytsiaoblenerho.json"
        OUT_DIR="images/Vinnytsiaoblenerho"
        
        echo "🎨 Starting image generation..."
        mkdir -p "$OUT_DIR"
        
        if [ -f "scripts/render_png.py" ]; then
          echo "📊 Rendering per-queue charts..."
          python scripts/render_png.py --json "$JSON_FILE" --out "$OUT_DIR" --force
        fi
        
        if [ -f "scripts/render_all_today.py" ]; then
          echo "📊 Rendering TODAY overview..."
          python scripts/render_all_today.py --json "$JSON_FILE" --out "$OUT_DIR" --force
        elif [ -f "scripts/render_png_all_today.py" ]; then
          echo "📊 Rendering TODAY overview..."
          python scripts/render_png_all_today.py --json "$JSON_FILE" --out "$OUT_DIR" --force
        fi
        
        if [ -f "scripts/render_all_tomorrow.py" ]; then
          echo "📊 Rendering TOMORROW overview..."
          python scripts/render_all_tomorrow.py --json "$JSON_FILE" --out "$OUT_DIR" --force
        elif [ -f "scripts/render_png_all_tomorrow.py" ]; then
          echo "📊 Rendering TOMORROW overview..."
          python scripts/render_png_all_tomorrow.py --json "$JSON_FILE" --out "$OUT_DIR" --force
        fi
